<!-- Showcase for the website: the docs link to this file, and the site turns it into a name pruner. -->
<!-- Examples: data-class is a class path from the type rules table. The first code element is the old name. -->
<!-- Rules: a copy of Config/DefaultNsBonsai.ini. Keep them the same as the ini. -->
<figure class="ns-bonsai" data-separator="_">
  <figcaption>Pick an asset type and type an old asset name. The demo shows the name that the review window proposes, with the default settings and the shipped rules. Change the domain, the category, or the case of the asset name, as in the window.</figcaption>
  <ul data-list="examples">
    <li data-class="/Script/Engine.StaticMesh"><code>BP_Environment_Rock_Cliff_02</code> (StaticMesh) gives <code>SM_Environment_Rock_Cliff_02_A</code>. The wrong type token goes.</li>
    <li data-class="/Script/Engine.Texture2D"><code>t_ui_Icon_HeartOutline</code> (Texture2D) gives <code>T_UI_Icon_HeartOutline_A</code>. The alias <code>ui</code> becomes <code>UI</code>.</li>
    <li data-class="/Script/Engine.StaticMesh"><code>Props_Furniture_Chair_Wooden_FINAL</code> (StaticMesh) gives <code>SM_Props_Furniture_Chair_Wooden_A</code>. The type token comes first. <code>FINAL</code> is all capitals, so it counts as an old variant and goes.</li>
    <li data-class="/Script/Engine.SoundWave"><code>Audio_UI_Click__03</code> (SoundWave) gives <code>S_Audio_UI_Click_03_A</code>. The double underscore goes.</li>
    <li data-class="/Script/Engine.StaticMesh"><code>SM_Foliage_Tree_Birch_A</code> (StaticMesh) gives <code>SM_Foliage_Tree_Birch_A</code>. The name is already in the pattern.</li>
    <li data-class="/Script/Engine.StaticMesh"><code>Boulder_big_01</code> (StaticMesh) gives <code>SM_AI_Behavior_Boulder_big_01_A</code>. The old name has no domain, so the window selects the first domain from A to Z. Pick the domain.</li>
  </ul>

  <p>The demo has no other assets and no recent picks. Thus the variant is always <code>A</code>, and the domain and category lists are in A to Z order. At rename, NsBonsai takes the first free variant.</p>
